packages:
  - .
  - apps/*
  - packages/*
  - e2e

# Supply-chain policy. Settings that pnpm 11 already defaults are written out as well, so a
# pnpm upgrade cannot change them silently. `pnpm check:supply` installs canary packages from
# a local registry under this file to prove that each protection still makes installs fail.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true

# Exceptions name exact versions only (name@1.2.3, or name@1.2.3 || 1.2.4): an entry with just
# a package name would also let every future release through. Each group of entries starts
# with three comment lines, `reason:`, `reviewer:` and `expires:` (YYYY-MM-DD in UTC, at most
# 90 days ahead). `pnpm check:supply` fails once a group has expired or names a version that
# is no longer in pnpm-lock.yaml.
trustPolicyExclude:
  # reason: @types/node 22 requires undici-types ~6.21.0. 6.13.0 to 6.19.2 were published with
  #   provenance and 6.19.3 to 6.21.0 without it, so no-downgrade rejects 6.21.0. Remove this
  #   entry when @types/node moves to a release line that depends on undici-types 7.
  # reviewer: Nirvana-Jie
  # expires: 2027-01-20
  - undici-types@6.21.0

# Only packages set to true may run install scripts; any unlisted package with one fails the install.
# lefthook's postinstall would install Git hooks into every checkout that runs `pnpm install`,
# including worktrees made to review outside changes, so it never runs: each clone installs the
# hooks by hand (see AGENTS.md).
allowBuilds:
  electron: true
  esbuild: true
  lefthook: false

# Every dependency version lives here, pinned exactly; package.json files refer to it with `catalog:`.
# With these two settings `pnpm add <name>` writes `catalog:` and an exact catalog entry by itself.
catalogMode: strict
savePrefix: ''
catalog:
  '@shikijs/core': 4.5.0
  '@shikijs/engine-javascript': 4.5.0
  '@shikijs/langs': 4.5.0
  katex: 0.19.0
