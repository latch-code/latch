  docx-preview: 0.4.1
  fflate: 0.8.3
  numfmt: 4.0.1
  papaparse: 5.7.0
  pdfjs-dist: 6.4.299
  '@playwright/test': 1.64.1
  '@types/node': 22.20.5
  '@types/qrcode': 1.5.6
