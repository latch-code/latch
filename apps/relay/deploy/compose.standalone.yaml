# Self-contained Docker Compose stack with sensible defaults for personal/team self-hosting.
# From the directory containing this file, provision the private bind mount before initializing:
#   sudo install -d -m 0700 -o 65532 -g 65532 "${LATCH_RELAY_DATA_DIR:-./data}"
# For reverse-proxy mode behind Caddy/Nginx on :443, initialize once:
#   docker compose -f compose.standalone.yaml run --rm relay init --data-dir /var/lib/latch-relay --domain relay.example.com --behind-proxy
# Then start and export the connection file:
#   docker compose -f compose.standalone.yaml up -d
#   docker compose -f compose.standalone.yaml exec -T relay /opt/latch/node --disable-sigusr1 /opt/latch/latch-relay.mjs profile --data-dir /var/lib/latch-relay --url https://relay.example.com --output /var/lib/latch-relay/connection.json
services:
  relay:
    image: ${LATCH_RELAY_IMAGE:?Set the built or published latch-relay image}
    init: true
    network_mode: host
    user: '65532:65532'
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: ${LATCH_RELAY_MEMORY_BYTES:-536870912}
    pids_limit: ${LATCH_RELAY_PID_LIMIT:-256}
    stop_grace_period: 75s
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=${LATCH_RELAY_TMPFS_BYTES:-67108864},mode=1777
    volumes:
      - type: bind
        source: ${LATCH_RELAY_DATA_DIR:-./data}
        target: /var/lib/latch-relay
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /opt/latch/node, --disable-sigusr1, /opt/latch/latch-relay.mjs, health, --data-dir, /var/lib/latch-relay]
      interval: ${LATCH_RELAY_HEALTH_INTERVAL:-30s}
      timeout: 5s
      retries: ${LATCH_RELAY_HEALTH_RETRIES:-3}
