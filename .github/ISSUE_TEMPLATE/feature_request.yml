name: Feature request
description: Suggest a feature or a new Harness.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it should work. Mention any workarounds you use now.
    validations:
      required: true
