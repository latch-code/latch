name: Set up Node.js, Go and dependencies
description: Installs pinned Node.js, the patched Go TLS toolchain, pnpm and locked dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - name: Set up patched Go TLS toolchain
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.10'
        check-latest: false
        cache: false

    # Corepack, bundled with Node.js 24, downloads the pnpm named in packageManager and refuses it
    # unless its sha512 matches the one pinned there.
    - name: Enable pnpm
      shell: bash
      run: corepack enable pnpm

    # A frozen install checks every locked version against the release-age and trust policy again.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
