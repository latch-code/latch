name: e2e-web

# Runs nightly until the browser suite has proven stable on hosted runners; then it moves to pull requests.
on:
  schedule:
    - cron: '23 3 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  e2e-web:
    name: e2e-web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up
        uses: $/.github/actions/setup
      - name: Build
        run: pnpm build
      - name: Browser end-to-end tests
        env:
          # Google Chrome from the runner image, instead of downloading Playwright's Chromium.
          HARNESS_BROWSER_PATH: /usr/bin/google-chrome
        run: pnpm test:e2e
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
